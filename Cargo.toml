[workspace]
resolver = "2"
members = ["zigbee", "firmware"]

[patch.crates-io]
zigbee-rs = { path = "zigbee" }

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 2
overflow-checks = false

[profile.dev]
opt-level = 3
