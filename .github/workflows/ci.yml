name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p zigbee-rs --all-targets --target x86_64-unknown-linux-gnu
      - run: cargo test -p zigbee-rs --target x86_64-unknown-linux-gnu

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imac-unknown-none-elf
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --release
      - run: cargo build --release

  firmware-against-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --config 'patch.crates-io.zigbee-rs.path="zigbee"'

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cp -R zigbee "$RUNNER_TEMP/crate"
      - run: cargo build
        working-directory: ${{ runner.temp }}/crate

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish -p zigbee-rs --dry-run --target x86_64-unknown-linux-gnu
      - name: the release carries no tests
        run: |
          set -euo pipefail
          cargo package -p zigbee-rs --list --target x86_64-unknown-linux-gnu > packaged.txt
          if grep -q '^tests/' packaged.txt; then
            echo "the package would carry the tests"
            exit 1
          fi

  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-semver-checks
      - run: cargo semver-checks -p zigbee-rs --target x86_64-unknown-linux-gnu

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit --deny warnings --ignore RUSTSEC-2024-0436
